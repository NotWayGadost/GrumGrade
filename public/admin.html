<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#111217">
<title>GRUMGrade Админ</title>
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#111217;--panel:#1a1b21;--panel2:#23242c;--line:#2c2d36;--accent:#ffd21f;--text:#ececf2;--muted:#8b8c99;--win:#3ddc84;--lose:#ff4d5e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 500px at 80% -10%,rgba(255,176,0,.1),transparent 60%),var(--bg);color:var(--text);font:14px 'Exo 2',system-ui,sans-serif;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
input,select{font:inherit;color:var(--text);background:#14151a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
.btn{background:linear-gradient(180deg,#ffdc3a,#ffc400);color:#1a1400;font-weight:800;border-radius:10px;padding:10px 16px;white-space:nowrap}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--text)}
.btn.red{background:var(--lose);color:#fff}.btn.green{background:var(--win);color:#04210f}
.btn:disabled{opacity:.5}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);position:sticky;top:0;background:rgba(17,18,23,.85);backdrop-filter:blur(14px);z-index:5}
header b{font-size:18px;font-weight:900}header b i{font-style:normal;color:var(--accent)}
header .sp{margin-left:auto;display:flex;gap:8px}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.login{max-width:360px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;text-align:center}
.login h1{font-size:22px;margin-bottom:6px}.login p{color:var(--muted);margin-bottom:18px}
.login form{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px}
.tabs button{padding:9px 14px;border-radius:10px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.04)}
.tabs button.on{color:#1a1400;background:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.cardx{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
.cardx small{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase}
.cardx b{display:block;font-size:20px;margin-top:4px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.panel h3{font-size:15px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>input,.row>select{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap}
th{color:var(--muted);font-size:11px;text-transform:uppercase}
tr.click{cursor:pointer}tr.click:hover{background:rgba(255,255,255,.03)}
.tbl{overflow-x:auto}
.pos{color:var(--win)}.neg{color:var(--lose)}.mut{color:var(--muted)}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;font-size:11px;font-weight:800;background:rgba(255,255,255,.08)}
.tag.red{background:rgba(255,77,94,.2);color:var(--lose)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.quick button{padding:7px 11px;border-radius:9px;background:rgba(255,210,31,.12);color:var(--accent);font-weight:800}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.inv div{background:var(--panel2);border-radius:9px;padding:6px;font-size:11px;text-align:center}
.inv img{width:100%;height:44px;object-fit:contain}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#23242c;border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.hide{display:none!important}
@media (max-width:600px){.cards{grid-template-columns:repeat(2,1fr)}.cardx b{font-size:17px}.wrap{padding:12px}header{padding:12px}}
</style>
</head>
<body>
<div id="loginView" class="login hide">
  <h1>🔐 Админ-панель</h1><p>GRUMGrade</p>
  <form id="loginForm"><input type="password" id="pw" placeholder="Пароль" autocomplete="current-password" required><button class="btn" type="submit">Войти</button></form>
</div>

<div id="app" class="hide">
  <header><b>GRUM<i>Grade</i> · админ</b><div class="sp"><a class="btn ghost" href="/">На сайт</a><button class="btn ghost" id="logout">Выйти</button></div></header>
  <div class="wrap">
    <div class="tabs" id="tabs"><button data-t="stats" class="on">Статистика</button><button data-t="users">Игроки</button><button data-t="wd">Выводы</button><button data-t="log">Журнал</button></div>
    <section data-s="stats"><div class="cards" id="stats"></div>
      <div class="panel" style="margin-top:14px"><h3>Цены</h3><div class="row"><span class="mut">Подтянуть свежие цены со Skinport прямо сейчас</span><button class="btn" id="prices">Обновить цены</button></div></div>
    </section>
    <section data-s="users" class="hide">
      <div class="panel"><div class="row"><input id="uq" placeholder="Ник, SteamID или ID игрока"><button class="btn" id="usearch">Найти</button><button class="btn ghost hide" id="meBtn">Это я</button></div></div>
      <div class="panel tbl"><table><thead><tr><th>ID</th><th>Ник</th><th>Баланс</th><th>Игр</th><th>Статус</th></tr></thead><tbody id="ulist"></tbody></table></div>
      <div id="udetail"></div>
    </section>
    <section data-s="wd" class="hide"><div class="panel tbl"><table><thead><tr><th>#</th><th>Игрок</th><th>Предмет</th><th>Цена</th><th>Трейд-ссылка</th><th></th></tr></thead><tbody id="wdlist"></tbody></table></div></section>
    <section data-s="log" class="hide"><div class="panel tbl"><table><thead><tr><th>Когда</th><th>Действие</th><th>Игрок</th><th>Детали</th><th>IP</th></tr></thead><tbody id="loglist"></tbody></table></div></section>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=k=>(k/100).toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2});
const dt=t=>t?new Date(t).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2500)}
async function api(p,body){const o=body!==undefined?{method:'POST',headers:{'Content-Type':'application/json','x-grum':'1'},body:JSON.stringify(body)}:{};
  const r=await fetch(p,{credentials:'same-origin',...o});const j=await r.json().catch(()=>({error:'Ошибка сети'}));if(!r.ok)throw new Error(j.error||'Ошибка');return j}
let ITEMS=[],ME=null;

async function boot(){const m=await api('/api/admin/me');ME=m.me;
  if(!m.admin){$('#loginView').classList.remove('hide');$('#app').classList.add('hide');$('#pw').focus();return}
  $('#loginView').classList.add('hide');$('#app').classList.remove('hide');$('#meBtn').classList.toggle('hide',!ME);
  if(!ITEMS.length)ITEMS=(await api('/api/catalog')).items;
  loadStats();loadUsers()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/admin/login',{password:$('#pw').value});$('#pw').value='';boot()}catch(err){toast(err.message)}};
$('#logout').onclick=async()=>{await api('/api/admin/logout',{});boot()};
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  document.querySelectorAll('section[data-s]').forEach(s=>s.classList.toggle('hide',s.dataset.s!==t));
  ({stats:loadStats,users:loadUsers,wd:loadWd,log:loadLog})[t]()};

async function loadStats(){const s=await api('/api/admin/stats');
  const c=[['Игроков',s.users],['Онлайн сейчас',s.online],['Апгрейдов',s.games.upgrade],['Кейсов открыто',s.games.case],['Ставок всего',fmt(s.stakes)],['Выплачено',fmt(s.payouts)],['Профит сайта',fmt(s.stakes-s.payouts)],['Депозиты',fmt(s.deposits)],['Демо-пополнения',fmt(s.demoTopups)],['Выдано админом',fmt(s.adminAdjust)],['Бонусы',fmt(s.bonuses)],['Балансы игроков',fmt(s.balances)],['Ждут вывода',s.pendingWithdrawals]];
  $('#stats').innerHTML=c.map(([k,v])=>`<div class="cardx"><small>${k}</small><b>${v}</b></div>`).join('')}
$('#prices').onclick=async()=>{try{await api('/api/admin/prices/refresh',{});toast('Обновление цен запущено (≈10 сек)')}catch(e){toast(e.message)}};

async function loadUsers(){const q=$('#uq').value.trim();const list=await api('/api/admin/users?q='+encodeURIComponent(q));
  $('#ulist').innerHTML=list.length?list.map(u=>`<tr class="click" data-id="${u.id}"><td>${u.id}</td><td>${esc(u.name)}<br><span class="mut" style="font-size:11px">${esc(u.steam_id)}</span></td><td>${fmt(u.balance)}</td><td>${u.games}</td><td>${u.banned?'<span class="tag red">бан</span>':'<span class="tag">ок</span>'}</td></tr>`).join(''):'<tr><td colspan="5" class="mut">Никого не найдено</td></tr>'}
$('#usearch').onclick=loadUsers;$('#uq').onkeydown=e=>{if(e.key==='Enter')loadUsers()};
$('#ulist').onclick=e=>{const tr=e.target.closest('tr[data-id]');if(tr)openUser(+tr.dataset.id)};
$('#meBtn').onclick=()=>ME&&openUser(ME.id);

async function openUser(id){const d=await api('/api/admin/users/'+id);const u=d.user;
  const opts=ITEMS.slice().sort((a,b)=>b.price-a.price).map(it=>`<option value="${it.id}">${esc(it.w+' | '+it.s)} ${it.wear?'('+it.wear+')':''} — ${fmt(it.price)}</option>`).join('');
  $('#udetail').innerHTML=`<div class="panel"><h3>${esc(u.name)} <span class="mut">#${u.id} · ${esc(u.steamId)}</span></h3>
   <div class="cards" style="margin-bottom:12px"><div class="cardx"><small>Баланс</small><b id="ubal">${fmt(u.balance)}</b></div><div class="cardx"><small>Предметов</small><b>${d.inventory.filter(x=>x.status==='owned').length}</b></div><div class="cardx"><small>Регистрация</small><b style="font-size:15px">${dt(u.createdAt)}</b></div></div>
   <h3>Баланс</h3><div class="row"><input id="bAmt" type="number" step="0.01" placeholder="Сумма (минус = списать)"><input id="bWhy" placeholder="Причина (необязательно)"><button class="btn" id="bGo">Применить</button></div>
   <div class="quick">${[100,1000,10000,100000,1000000].map(v=>`<button data-q="${v}">+${v.toLocaleString('ru-RU')}</button>`).join('')}</div>
   <h3 style="margin-top:16px">Выдать предмет</h3><div class="row"><select id="gItem">${opts}</select><input id="gCnt" type="number" min="1" max="50" value="1" style="max-width:90px;flex:0 0 90px"><button class="btn" id="gGo">Выдать</button></div>
   <h3 style="margin-top:16px">Доступ</h3><div class="row"><button class="btn ${u.banned?'green':'red'}" id="banGo">${u.banned?'Разбанить':'Забанить'}</button></div></div>
   <div class="panel"><h3>Инвентарь</h3><div class="inv">${d.inventory.map(x=>{const it=ITEMS[x.id];return it?`<div><img src="${it.img}/128fx128f" loading="lazy" alt="">${esc(it.s)}<br><b>${fmt(x.price)}</b>${x.status!=='owned'?'<br><span class="tag">вывод</span>':''}</div>`:''}).join('')||'<span class="mut">пусто</span>'}</div></div>
   <div class="panel tbl"><h3>Движения баланса</h3><table><tbody>${d.ledger.map(l=>`<tr><td>${dt(l.created_at)}</td><td>${esc(l.type)}</td><td class="${l.amount>0?'pos':'neg'}">${l.amount>0?'+':''}${fmt(l.amount)}</td><td class="mut">${esc(l.ref||'')}</td></tr>`).join('')||'<tr><td class="mut">нет</td></tr>'}</tbody></table></div>
   <div class="panel tbl"><h3>Игры</h3><table><tbody>${d.games.map(g=>{const it=ITEMS[g.item_id];return `<tr><td>${dt(g.created_at)}</td><td>${g.type==='case'?'кейс':'апгрейд'}</td><td>${it?esc(it.w+' | '+it.s):''}</td><td>ставка ${fmt(g.stake)}</td><td class="${g.payout>0?'pos':'neg'}">${g.payout>0?'+'+fmt(g.payout):'проигрыш'}</td></tr>`}).join('')||'<tr><td class="mut">нет</td></tr>'}</tbody></table></div>`;
  const setBal=async v=>{try{const r=await api(`/api/admin/users/${id}/balance`,{amount:v,reason:$('#bWhy').value});$('#ubal').textContent=fmt(r.balance);toast('Баланс изменён');loadUsers()}catch(e){toast(e.message)}};
  $('#bGo').onclick=()=>{const v=+$('#bAmt').value;if(v)setBal(v)};
  $('#udetail').querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>setBal(+b.dataset.q));
  $('#gGo').onclick=async()=>{try{await api(`/api/admin/users/${id}/give-item`,{itemId:+$('#gItem').value,count:+$('#gCnt').value});toast('Предмет выдан');openUser(id)}catch(e){toast(e.message)}};
  $('#banGo').onclick=async()=>{try{await api(`/api/admin/users/${id}/ban`,{banned:!u.banned});toast(u.banned?'Разбанен':'Забанен');openUser(id);loadUsers()}catch(e){toast(e.message)}};
  $('#udetail').scrollIntoView({behavior:'smooth'})}

async function loadWd(){const list=await api('/api/admin/withdrawals?status=pending');
  $('#wdlist').innerHTML=list.length?list.map(w=>{const it=ITEMS[w.item_id];return `<tr><td>${w.id}</td><td>${esc(w.name)}</td><td>${it?esc(it.w+' | '+it.s):w.item_id}</td><td>${fmt(w.price)}</td><td><a href="${esc(w.trade_url)}" target="_blank" rel="noopener" style="color:var(--accent)">открыть</a></td><td><button class="btn green" data-wd="${w.id}" data-st="sent">Отправлено</button> <button class="btn ghost" data-wd="${w.id}" data-st="rejected">Отклонить</button></td></tr>`}).join(''):'<tr><td colspan="6" class="mut">Заявок нет</td></tr>'}
$('#wdlist').onclick=async e=>{const b=e.target.closest('[data-wd]');if(!b)return;try{await api('/api/admin/withdrawals/'+b.dataset.wd,{status:b.dataset.st});toast('Готово');loadWd()}catch(err){toast(err.message)}};

async function loadLog(){const list=await api('/api/admin/log');
  $('#loglist').innerHTML=list.map(l=>`<tr><td>${dt(l.created_at)}</td><td>${esc(l.action)}</td><td>${l.target_user??''}</td><td class="mut">${esc(l.details||'')}</td><td class="mut">${esc(l.ip||'')}</td></tr>`).join('')||'<tr><td class="mut">пусто</td></tr>'}

boot().catch(e=>toast(e.message));
</script>
</body>
</html>
