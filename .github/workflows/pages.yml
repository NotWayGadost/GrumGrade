# Приложение GRUMGrade для телефона на GitHub Pages: https://notwaygadost.github.io/GrumGrade/
# На iPhone: открыть ссылку → «Поделиться» → «На экран Домой». Работает без интернета.
# Один раз включить: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Приложение (Pages)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'data/items.json', 'server/catalog.js', 'mobile/**', '.github/workflows/pages.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Кэш картинок скинов
        uses: actions/cache@v4
        with:
          path: mobile/.cache
          key: grum-assets-${{ hashFiles('data/items.json') }}
          restore-keys: grum-assets-
      - name: Собрать офлайн-приложение
        working-directory: mobile
        run: node build-www.js --web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile/www

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
